<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán Chuyên · Góc học tập</title>
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
/* ======================================================================
   TOKENS
   ====================================================================== */
:root{
  --paper:#FAF7F0;
  --surface:#FFFFFF;
  --ink:#1E2430;
  --ink-soft:#5B6472;
  --line:#E4DFD1;
  --line-strong:#CFC8B4;
  --accent:#2B5D5E;
  --accent-ink:#173C3D;
  --accent-soft:#E4EEEB;
  --amber:#B8792F;
  --amber-soft:#F3E8D8;
  --danger:#A8432E;
  --grid-line: rgba(43,93,94,0.06);
  --danger-soft:#F5E4DE;
  --shadow: 0 1px 2px rgba(30,36,48,0.04), 0 8px 24px -12px rgba(30,36,48,0.15);
  --radius-s: 6px;
  --radius-m: 10px;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --paper:#171A1F; --surface:#1E2229; --ink:#EDEAE0; --ink-soft:#9CA3AF;
    --line:#2C313A; --line-strong:#3A4048; --accent:#6FB3AC; --accent-ink:#BFE3DD;
    --accent-soft:#20302E; --amber:#D9A251; --amber-soft:#332A1C; --danger:#E28777;
    --danger-soft:#3A241E; --grid-line: rgba(111,179,172,0.05);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --paper:#171A1F; --surface:#1E2229; --ink:#EDEAE0; --ink-soft:#9CA3AF;
  --line:#2C313A; --line-strong:#3A4048; --accent:#6FB3AC; --accent-ink:#BFE3DD;
  --accent-soft:#20302E; --amber:#D9A251; --amber-soft:#332A1C; --danger:#E28777;
  --danger-soft:#3A241E; --grid-line: rgba(111,179,172,0.05);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ======================================================================
   LAYOUT
   ====================================================================== */
.app{ display:flex; min-height:100%; }

/* ---- Sidebar ---- */
.sidebar{
  width:300px; flex:0 0 300px; background:var(--surface);
  border-right:1px solid var(--line); height:100vh; height:100dvh;
  position:sticky; top:0; display:flex; flex-direction:column;
  padding-top: env(safe-area-inset-top, 0px);
  transition: transform .25s ease; z-index:40;
}
.sidebar-head{padding:22px 20px 16px; border-bottom:1px solid var(--line);}
.brand{ display:flex; align-items:baseline; gap:8px; }
.brand .mark{
  font-family:var(--serif); font-style:italic; font-weight:600;
  font-size:26px; color:var(--accent); line-height:1;
}
.brand .name{
  font-family:var(--serif); font-size:20px; font-weight:600; letter-spacing:.2px;
}
.brand-sub{ margin-top:4px; font-size:12.5px; color:var(--ink-soft); }
.progress-overall{ margin-top:14px; }
.progress-overall .row{
  display:flex; justify-content:space-between; font-size:12px;
  color:var(--ink-soft); margin-bottom:5px;
}
.progress-track{ height:5px; border-radius:99px; background:var(--line); overflow:hidden; }
.progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .4s ease; }

.search-wrap{ padding:14px 20px 6px; }
.search-box{
  display:flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:8px 10px; background:var(--paper);
}
.search-box svg{flex:none; opacity:.5;}
.search-box input{
  border:0; outline:0; background:transparent;
  font-family:var(--sans); font-size:13.5px; color:var(--ink); width:100%;
}
.search-box input::placeholder{color:var(--ink-soft);}

/* ---- View switch (Bài học / Điểm danh) ---- */
.view-switch{
  margin:14px 20px 4px; display:flex; gap:4px; padding:3px;
  background:var(--paper); border:1px solid var(--line);
  border-radius:var(--radius-s);
}
.view-btn{
  flex:1; border:0; background:transparent; color:var(--ink-soft);
  font-family:var(--sans); font-size:12.5px; font-weight:600;
  padding:7px 6px; border-radius:calc(var(--radius-s) - 2px);
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
}
.view-btn:hover{color:var(--ink);}
.view-btn.active{
  background:var(--surface); color:var(--accent-ink); box-shadow: var(--shadow);
}
.view-btn-badge{
  font-family:var(--mono); font-size:9.5px; font-weight:600;
  color:var(--danger); min-width:14px;
}
.view-btn-badge:empty{display:none;}

.toc{ flex:1; overflow-y:auto; padding:10px 12px 24px; }
.chuong{ margin-bottom:4px; }
.chuong-head{
  width:100%; display:flex; align-items:center; gap:9px;
  padding:9px 8px; border:0; background:transparent; cursor:pointer;
  border-radius:var(--radius-s); text-align:left;
  font-family:var(--sans); color:var(--ink);
}
.chuong-head:hover{background:var(--accent-soft);}
.chuong-head .chevron{
  width:14px; height:14px; flex:none; color:var(--ink-soft);
  transition:transform .18s ease;
}
.chuong.open .chevron{transform:rotate(90deg);}
.chuong-head .ctitle{ flex:1; font-size:13.5px; font-weight:600; }
.chuong-head .ccount{
  font-family:var(--mono); font-size:10.5px; color:var(--ink-soft);
  background:var(--paper); border:1px solid var(--line);
  border-radius:99px; padding:1px 7px;
}
.bai-list{
  list-style:none; margin:2px 0 8px; padding:0 0 0 28px;
  display:none; border-left:1px solid var(--line); margin-left:16px;
}
.chuong.open .bai-list{display:block;}
.bai-list li{margin:1px 0;}
.bai-link{
  width:100%; display:flex; align-items:center; gap:8px;
  padding:7px 10px; border:0; background:transparent; cursor:pointer;
  border-radius:var(--radius-s); font-family:var(--sans);
  font-size:13px; color:var(--ink-soft); text-align:left; line-height:1.3;
}
.bai-link:hover{background:var(--accent-soft); color:var(--ink);}
.bai-link.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
.bai-link .dot{
  width:7px; height:7px; flex:none; border-radius:99px;
  border:1.5px solid var(--line-strong); background:transparent;
}
.bai-link.done .dot{ background:var(--accent); border-color:var(--accent); }

.sidebar-foot{
  padding:12px 20px; border-top:1px solid var(--line); font-size:11px;
  color:var(--ink-soft); display:flex; justify-content:space-between; align-items:center;
}
.theme-btn{
  border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  border-radius:var(--radius-s); padding:5px 8px; cursor:pointer;
  font-size:11px; font-family:var(--sans);
}

/* ---- Main ---- */
.main{ flex:1; min-width:0; padding: 28px 40px 80px; }
.mobile-bar{ display:none; }
.crumbs{ font-size:12.5px; color:var(--ink-soft); margin-bottom:10px; }
.crumbs span{color:var(--ink);}

.topic-head{
  padding-bottom:18px; border-bottom:1px solid var(--line);
  margin-bottom:22px; display:flex; justify-content:space-between;
  align-items:flex-end; gap:20px; flex-wrap:wrap;
}
.topic-title{
  font-family:var(--serif); font-weight:600;
  font-size:clamp(26px, 3.4vw, 36px); line-height:1.15; max-width:640px;
}
.topic-title .num{ color:var(--accent); font-style:italic; margin-right:10px; }
.done-toggle{
  display:flex; align-items:center; gap:8px;
  border:1px solid var(--line-strong); background:var(--surface);
  border-radius:99px; padding:7px 14px 7px 10px; cursor:pointer;
  font-family:var(--sans); font-size:13px; color:var(--ink-soft); white-space:nowrap;
}
.done-toggle .dot{
  width:16px; height:16px; border-radius:99px;
  border:2px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center; flex:none;
}
.done-toggle.done{
  border-color:var(--accent); color:var(--accent-ink); background:var(--accent-soft);
}
.done-toggle.done .dot{ background:var(--accent); border-color:var(--accent); color:#fff; }
.done-toggle .dot svg{width:10px;height:10px;opacity:0;}
.done-toggle.done .dot svg{opacity:1;}

.tabs{
  display:flex; gap:4px; margin-bottom:26px; border-bottom:1px solid var(--line);
}
.tab-btn{
  border:0; background:transparent; padding:9px 4px; margin-right:22px;
  cursor:pointer; font-family:var(--sans); font-size:14.5px;
  font-weight:500; color:var(--ink-soft); position:relative; top:1px;
}
.tab-btn .n{ font-family:var(--mono); font-size:10.5px; color:var(--ink-soft); margin-left:5px; }
.tab-btn.active{ color:var(--ink); border-bottom:2px solid var(--accent); font-weight:600; }

.panel{display:none;}
.panel.active{display:block; animation: fadein .22s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}

/* ---- Lý thuyết ---- */
.ly-thuyet{ max-width:760px; font-size:16px; line-height:1.75; }
.ly-thuyet p{margin:0 0 16px;}
.lt-panel{ display:none; max-width:760px; }
.lt-panel.active{display:block; animation: fadein .22s ease;}

/* Tiêu đề mục trong bài — to, đổi màu, có gạch chân */
.section-title{
  font-family: var(--serif);
  font-weight: 700;
  font-size: clamp(22px, 2.6vw, 28px);
  line-height: 1.25;
  letter-spacing: -.2px;
  color: var(--accent);
  margin: 8px 0 20px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--accent);
}

.block{ margin: 0; }
.block-label{
  font-family:var(--mono); font-size:11px; letter-spacing:.04em;
  text-transform:uppercase; color:var(--accent);
  margin-bottom:8px; font-weight:500;
}
.block.dinhnghia, .block.dinhly{
  border:1px solid var(--line-strong); border-left:4px solid var(--accent);
  border-radius:0 var(--radius-m) var(--radius-m) 0;
  padding:18px 22px; background:var(--surface); box-shadow: var(--shadow);
}
.block.dinhnghia .block-label{color:var(--ink-soft);}
.block.dinhly .block-title, .block.dinhnghia .block-title{
  font-family:var(--serif); font-weight:700; font-size:20px;
  line-height:1.3; margin-bottom:10px; color:var(--accent-ink);
}
.block.luuy{
  border-left:4px solid var(--amber); background:var(--amber-soft);
  padding:16px 20px; border-radius:0 var(--radius-m) var(--radius-m) 0;
  font-size:15px;
}
.block.luuy .block-label{color:var(--amber);}
.block.luuy .block-title{
  font-family:var(--serif); font-weight:700; font-size:18px;
  margin-bottom:8px; color:var(--ink);
}
.block.text .block-title,
.block.text > p:first-child strong,
.block.text > p:first-child b{
  font-family:var(--serif); font-weight:700; font-size:20px;
  color:var(--accent-ink); display:block; margin-bottom:12px; line-height:1.3;
}
.block > :last-child{margin-bottom:0;}

/* ---- Ví dụ ---- */
.sub-tabs{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
.sub-tab{
  border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink-soft); border-radius:99px; padding:6px 14px;
  font-family:var(--sans); font-size:13px; font-weight:500;
  cursor:pointer; white-space:nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.sub-tab:hover{background:var(--accent-soft); color:var(--ink);}
.sub-tab.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

.vidu{
  border:1px solid var(--line); border-radius:var(--radius-m);
  overflow:hidden; background:var(--surface); display:none;
}
.vidu.active{display:block; animation: fadein .22s ease;}
.vidu-head{
  padding:14px 20px; display:flex; justify-content:space-between;
  align-items:center; gap:12px; border-bottom:1px solid var(--line);
}
.vidu-head .ten{ font-family:var(--serif); font-weight:600; font-size:16px; }
.vidu-body{padding:18px 20px; font-size:15.5px; line-height:1.7;}
.vidu-de{margin-bottom:2px;}
.reveal-btn{
  border:1px solid var(--line-strong); background:transparent;
  color:var(--accent-ink); border-radius:99px; padding:6px 14px;
  font-family:var(--sans); font-size:12.5px; font-weight:500;
  cursor:pointer; white-space:nowrap;
}
.reveal-btn:hover{background:var(--accent-soft);}
.loigiai{
  margin-top:16px; padding-top:16px;
  border-top:1px dashed var(--line-strong); display:none;
}
.loigiai.show{display:block;}
.loigiai .tag{
  font-family:var(--mono); font-size:10.5px;
  color:var(--amber); margin-bottom:10px;
}
.loigiai-layout{ display:flex; gap:20px; align-items:flex-start; }
.loigiai-text{ flex:1; min-width:0; font-size:15.5px; line-height:1.7; }
.loigiai-text > p:first-child{margin-top:0;}
.loigiai-fig{ flex:0 0 280px; width:280px; position:sticky; top:16px; }
@media (max-width:720px){
  .loigiai-layout{flex-direction:column;}
  .loigiai-fig{flex:none; width:100%; position:static;}
}

.img-placeholder{
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:10px; margin:0; padding:16px;
  border:2px dashed var(--line-strong); border-radius:var(--radius-m);
  background:var(--paper); color:var(--ink-soft); text-align:center;
  min-height:180px; position:relative;
  transition: border-color .2s, background .2s;
  width:100%; box-sizing:border-box;
}
.img-placeholder:hover,
.img-placeholder.dragover{ border-color:var(--accent); background:var(--accent-soft); }
.img-placeholder.has-image{ border-style:solid; padding:10px; min-height:0; }
.img-placeholder .ph-empty{ display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
.img-placeholder.has-image .ph-empty{display:none;}
.img-placeholder .ph-icon{font-size:28px; line-height:1;}
.img-placeholder .ph-title{font-size:14px; font-weight:500; color:var(--ink);}
.img-placeholder .ph-hint{font-size:11.5px; opacity:.75;}
.img-placeholder .ph-preview{ display:none; width:100%; }
.img-placeholder.has-image .ph-preview{display:block;}
.img-placeholder .ph-preview img{
  max-width:100%; height:auto; border-radius:var(--radius-s);
  display:block; margin:0 auto;
}
.img-placeholder .ph-actions{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:4px; }
.img-placeholder .ph-btn{
  border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink); border-radius:99px; padding:6px 12px;
  font-family:var(--sans); font-size:12px; font-weight:500; cursor:pointer;
}
.img-placeholder .ph-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
.img-placeholder .ph-btn.danger{color:var(--danger); border-color:var(--danger);}
.img-placeholder .ph-btn.danger:hover{background:rgba(168,67,46,.08);}
.img-placeholder input[type="file"]{display:none;}
.loigiai img, .vidu-body img{
  max-width:100%; height:auto; border-radius:var(--radius-s);
  margin:12px 0; display:block;
}

/* ---- Bài tập ---- */
.baitap{
  display:none; gap:14px; padding:18px 20px;
  border:1px solid var(--line); border-radius:var(--radius-m);
  background:var(--surface); box-shadow: var(--shadow); max-width:760px;
}
.baitap.active{display:flex; animation: fadein .22s ease;}
.baitap .idx{
  font-family:var(--serif); font-style:italic; font-size:20px;
  color:var(--accent); flex:none; width:28px; line-height:1.4;
}
.baitap-content{flex:1; min-width:0;}
.baitap-de{font-size:15.5px; line-height:1.7;}
.baitap-de > p:last-child{margin-bottom:0;}
.baitap-meta{ display:flex; gap:8px; margin-top:10px; align-items:center; }
.baitap-answer{
  margin-top:12px; padding:12px 16px; background:var(--accent-soft);
  border-radius:var(--radius-s); font-size:14.5px; display:none;
}
.baitap-answer.show{display:block;}

.empty-state{
  padding:60px 20px; text-align:center; color:var(--ink-soft);
  max-width:420px; margin:0 auto;
}
.empty-state .big{
  font-family:var(--serif); font-style:italic; font-size:22px;
  color:var(--ink); margin-bottom:8px;
}

/* ---- Điểm danh ---- */
.dd-sessions{margin-bottom:20px;}
.dd-stats{
  display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px; margin-bottom:22px; max-width:760px;
}
.dd-stat{
  border:1px solid var(--line); border-radius:var(--radius-m);
  background:var(--surface); padding:14px 16px; box-shadow: var(--shadow);
}
.dd-stat-num{
  font-family:var(--serif); font-weight:700; font-size:26px;
  line-height:1.1; color:var(--ink);
}
.dd-stat.present .dd-stat-num{color:var(--accent-ink);}
.dd-stat.absent .dd-stat-num{color:var(--danger);}
.dd-stat-label{ margin-top:4px; font-size:12px; color:var(--ink-soft); }
.dd-toolbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px;
  margin-bottom:18px; max-width:760px;
}
.dd-search{ flex:1 1 220px; min-width:180px; }
.dd-select{
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:8px 10px; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:13px;
}
.dd-status-chips{ display:flex; gap:6px; }
.dd-chip{
  border:1px solid var(--line-strong); background:var(--surface);
  color:var(--ink-soft); border-radius:99px; padding:6px 13px;
  font-family:var(--sans); font-size:12.5px; font-weight:500;
  cursor:pointer; white-space:nowrap;
}
.dd-chip:hover{background:var(--accent-soft); color:var(--ink);}
.dd-chip.active{ background:var(--accent); border-color:var(--accent); color:#fff; }
.dd-table-wrap{
  max-width:760px; border:1px solid var(--line);
  border-radius:var(--radius-m); overflow:hidden;
  background:var(--surface); box-shadow: var(--shadow);
}
.dd-table{ width:100%; border-collapse:collapse; font-size:14px; }
.dd-table thead th{
  text-align:left; font-family:var(--mono); font-size:10.5px;
  text-transform:uppercase; letter-spacing:.04em;
  color:var(--ink-soft); font-weight:500;
  padding:10px 16px; background:var(--paper); border-bottom:1px solid var(--line);
}
.dd-table th.stt, .dd-table td.stt{width:52px; text-align:center;}
.dd-table th.status, .dd-table td.status{width:120px; text-align:right;}
.dd-table td{ padding:10px 16px; border-bottom:1px solid var(--line); color:var(--ink); }
.dd-table tbody tr:last-child td{border-bottom:0;}
.dd-table tbody tr:hover{background:var(--accent-soft);}
.dd-table tbody tr.row-absent{background:var(--danger-soft);}
.dd-table tbody tr.row-absent:hover{background:var(--danger-soft);}
.dd-empty{ text-align:center; color:var(--ink-soft); padding:28px 16px !important; }
.dd-status-btn{
  border:1px solid var(--line-strong); border-radius:99px;
  padding:5px 12px; font-family:var(--sans); font-size:12px;
  font-weight:600; cursor:pointer; white-space:nowrap;
}
.dd-status-btn.present{
  background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);
}
.dd-status-btn.absent{ background:transparent; border-color:var(--danger); color:var(--danger); }
@media (max-width:640px){
  .dd-stats{grid-template-columns:repeat(2,minmax(0,1fr));}
  .dd-table th.status, .dd-table td.status{width:auto;}
}

.katex-display{ overflow-x:auto; overflow-y:hidden; padding:4px 0; }

/* ======================================================================
   RESPONSIVE
   ====================================================================== */
.sidebar-scrim{ display:none; }
@media (max-width: 880px){
  .sidebar{
    position:fixed; left:0; top:0; bottom:0;
    transform:translateX(-100%); box-shadow: var(--shadow);
  }
  body.nav-open .sidebar{transform:translateX(0);}
  body.nav-open .sidebar-scrim{
    display:block; position:fixed; inset:0;
    background:rgba(10,12,16,.4); z-index:35;
  }
  .main{padding:16px 18px 60px;}
  .mobile-bar{
    display:flex; align-items:center; gap:12px;
    padding: env(safe-area-inset-top,0px) 0 14px;
    margin-bottom:6px; position:sticky; top:0;
    background:var(--paper); z-index:20;
  }
  .mobile-bar button{
    border:1px solid var(--line-strong); background:var(--surface);
    border-radius:var(--radius-s); width:38px; height:38px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .mobile-bar .mb-title{ font-family:var(--serif); font-weight:600; font-size:16px; }
  .topic-title{max-width:100%;}
}

@media (max-width:520px){
  .tabs{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .tab-btn{margin-right:16px; white-space:nowrap;}
}

::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--line-strong); border-radius:99px;}
::-webkit-scrollbar-track{background:transparent;}

:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="brand">
        <span class="mark">∫</span>
        <span class="name" id="ten-mon">Toán Chuyên</span>
      </div>
      <div class="brand-sub" id="mo-ta">Lý thuyết · Ví dụ · Bài tập</div>
      <div class="progress-overall">
        <div class="row"><span>Tiến độ</span><span id="progress-label">0/0 bài</span></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      </div>
    </div>

    <div class="view-switch" id="view-switch">
      <button class="view-btn active" data-view="hoc" type="button">Bài học</button>
      <button class="view-btn" data-view="diemdanh" type="button">
        Điểm danh
        <span class="view-btn-badge" id="dd-nav-badge"></span>
      </button>
    </div>

    <div class="search-wrap" id="search-wrap">
      <div class="search-box">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="text" placeholder="Tìm bài học…">
      </div>
    </div>

    <nav class="toc" id="toc"></nav>

    <div class="sidebar-foot">
      <span>Tự học có định hướng</span>
      <button class="theme-btn" id="theme-btn" type="button">Giao diện</button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="scrim"></div>

  <main class="main">
    <div class="mobile-bar">
      <button id="hamburger" aria-label="Mở danh mục" type="button">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <span class="mb-title" id="mb-title">Toán Chuyên</span>
    </div>

    <div id="content"></div>
  </main>

</div>
