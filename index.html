<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toán Chuyên · Góc học tập</title>
<meta name="color-scheme" content="light dark">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>

<style>
/* ======================================================================
   TOKENS
   ====================================================================== */
:root{
  --paper:#FAF7F0;
  --surface:#FFFFFF;
  --ink:#1E2430;
  --ink-soft:#5B6472;
  --line:#E4DFD1;
  --line-strong:#CFC8B4;
  --accent:#2B5D5E;
  --accent-ink:#173C3D;
  --accent-soft:#E4EEEB;
  --amber:#B8792F;
  --amber-soft:#F3E8D8;
  --danger:#A8432E;
  --grid-line: rgba(43,93,94,0.06);
  --danger-soft:#F5E4DE;
  --shadow: 0 1px 2px rgba(30,36,48,0.04), 0 8px 24px -12px rgba(30,36,48,0.15);
  --radius-s: 6px;
  --radius-m: 10px;
  --serif: 'Newsreader', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  box-sizing: border-box;
}
:root:not([data-theme="light"]) {
  @media (prefers-color-scheme: dark){
    --paper:#171A1F;
    --surface:#1E2229;
    --ink:#EDEAE0;
    --ink-soft:#9CA3AF;
    --line:#2C313A;
    --line-strong:#3A4048;
    --accent:#6FB3AC;
    --accent-ink:#BFE3DD;
    --accent-soft:#20302E;
    --amber:#D9A251;
    --amber-soft:#332A1C;
    --danger:#E28777;
    --danger-soft:#3A241E;
    --grid-line: rgba(111,179,172,0.05);
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"]{
  --paper:#171A1F;
  --surface:#1E2229;
  --ink:#EDEAE0;
  --ink-soft:#9CA3AF;
  --line:#2C313A;
  --line-strong:#3A4048;
  --accent:#6FB3AC;
  --accent-ink:#BFE3DD;
  --accent-soft:#20302E;
  --amber:#D9A251;
  --amber-soft:#332A1C;
  --danger:#E28777;
  --danger-soft:#3A241E;
  --grid-line: rgba(111,179,172,0.05);
  --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.5);
}

*{box-sizing:border-box;}
html{scroll-padding-top: env(safe-area-inset-top, 0px);}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  background-image:
    linear-gradient(var(--grid-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
  background-size: 28px 28px;
}

/* ======================================================================
   LAYOUT
   ====================================================================== */
.app{
  display:flex;
  min-height:100%;
}

/* ---- Sidebar ---- */
.sidebar{
  width:300px;
  flex:0 0 300px;
  background:var(--surface);
  border-right:1px solid var(--line);
  height:100vh;
  height:100dvh;
  position:sticky;
  top:0;
  display:flex;
  flex-direction:column;
  padding-top: env(safe-area-inset-top, 0px);
  transition: transform .25s ease;
  z-index:40;
}
.sidebar-head{
  padding:22px 20px 16px;
  border-bottom:1px solid var(--line);
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
}
.brand .mark{
  font-family:var(--serif);
  font-style:italic;
  font-weight:600;
  font-size:26px;
  color:var(--accent);
  line-height:1;
}
.brand .name{
  font-family:var(--serif);
  font-size:20px;
  font-weight:600;
  letter-spacing:.2px;
}
.brand-sub{
  margin-top:4px;
  font-size:12.5px;
  color:var(--ink-soft);
}
.progress-overall{
  margin-top:14px;
}
.progress-overall .row{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--ink-soft);
  margin-bottom:5px;
}
.progress-track{
  height:5px;
  border-radius:99px;
  background:var(--line);
  overflow:hidden;
}
.progress-fill{
  height:100%;
  background:var(--accent);
  border-radius:99px;
  transition:width .4s ease;
}

.search-wrap{
  padding:14px 20px 6px;
}
.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line);
  border-radius:var(--radius-s);
  padding:8px 10px;
  background:var(--paper);
}
.search-box svg{flex:none; opacity:.5;}
.search-box input{
  border:0;
  outline:0;
  background:transparent;
  font-family:var(--sans);
  font-size:13.5px;
  color:var(--ink);
  width:100%;
}
.search-box input::placeholder{color:var(--ink-soft);}

/* ---- View switch (Bài học / Điểm danh) ---- */
.view-switch{
  margin:14px 20px 4px;
  display:flex;
  gap:4px;
  padding:3px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-s);
}
.view-btn{
  flex:1;
  border:0;
  background:transparent;
  color:var(--ink-soft);
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:600;
  padding:7px 6px;
  border-radius:calc(var(--radius-s) - 2px);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.view-btn:hover{color:var(--ink);}
.view-btn.active{
  background:var(--surface);
  color:var(--accent-ink);
  box-shadow: var(--shadow);
}
.view-btn-badge{
  font-family:var(--mono);
  font-size:9.5px;
  font-weight:600;
  color:var(--danger);
  min-width:14px;
}
.view-btn-badge:empty{display:none;}

.toc{
  flex:1;
  overflow-y:auto;
  padding:10px 12px 24px;
}
.chuong{
  margin-bottom:4px;
}
.chuong-head{
  width:100%;
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 8px;
  border:0;
  background:transparent;
  cursor:pointer;
  border-radius:var(--radius-s);
  text-align:left;
  font-family:var(--sans);
  color:var(--ink);
}
.chuong-head:hover{background:var(--accent-soft);}
.chuong-head .chevron{
  width:14px; height:14px; flex:none;
  color:var(--ink-soft);
  transition:transform .18s ease;
}
.chuong.open .chevron{transform:rotate(90deg);}
.chuong-head .ctitle{
  flex:1;
  font-size:13.5px;
  font-weight:600;
}
.chuong-head .ccount{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-soft);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:99px;
  padding:1px 7px;
}
.bai-list{
  list-style:none;
  margin:2px 0 8px;
  padding:0 0 0 28px;
  display:none;
  border-left:1px solid var(--line);
  margin-left:16px;
}
.chuong.open .bai-list{display:block;}
.bai-list li{margin:1px 0;}
.bai-link{
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 10px;
  border:0;
  background:transparent;
  cursor:pointer;
  border-radius:var(--radius-s);
  font-family:var(--sans);
  font-size:13px;
  color:var(--ink-soft);
  text-align:left;
  line-height:1.3;
}
.bai-link:hover{background:var(--accent-soft); color:var(--ink);}
.bai-link.active{
  background:var(--accent-soft);
  color:var(--accent-ink);
  font-weight:600;
}
.bai-link .dot{
  width:7px; height:7px; flex:none; border-radius:99px;
  border:1.5px solid var(--line-strong);
  background:transparent;
}
.bai-link.done .dot{
  background:var(--accent);
  border-color:var(--accent);
}

.sidebar-foot{
  padding:12px 20px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:var(--ink-soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.theme-btn{
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink-soft);
  border-radius:var(--radius-s);
  padding:5px 8px;
  cursor:pointer;
  font-size:11px;
  font-family:var(--sans);
}

/* ---- Main ---- */
.main{
  flex:1;
  min-width:0;
  padding: 28px 40px 80px;
}
.mobile-bar{
  display:none;
}
.crumbs{
  font-size:12.5px;
  color:var(--ink-soft);
  margin-bottom:10px;
}
.crumbs span{color:var(--ink);}

.topic-head{
  padding-bottom:18px;
  border-bottom:1px solid var(--line);
  margin-bottom:22px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:20px;
  flex-wrap:wrap;
}
.topic-title{
  font-family:var(--serif);
  font-weight:600;
  font-size:clamp(26px, 3.4vw, 36px);
  line-height:1.15;
  max-width:640px;
}
.topic-title .num{
  color:var(--accent);
  font-style:italic;
  margin-right:10px;
}
.done-toggle{
  display:flex;
  align-items:center;
  gap:8px;
  border:1px solid var(--line-strong);
  background:var(--surface);
  border-radius:99px;
  padding:7px 14px 7px 10px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:13px;
  color:var(--ink-soft);
  white-space:nowrap;
}
.done-toggle .dot{
  width:16px; height:16px; border-radius:99px;
  border:2px solid var(--line-strong);
  display:flex; align-items:center; justify-content:center;
  flex:none;
}
.done-toggle.done{
  border-color:var(--accent);
  color:var(--accent-ink);
  background:var(--accent-soft);
}
.done-toggle.done .dot{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}
.done-toggle .dot svg{width:10px;height:10px;opacity:0;}
.done-toggle.done .dot svg{opacity:1;}

.tabs{
  display:flex;
  gap:4px;
  margin-bottom:26px;
  border-bottom:1px solid var(--line);
}
.tab-btn{
  border:0;
  background:transparent;
  padding:9px 4px;
  margin-right:22px;
  cursor:pointer;
  font-family:var(--sans);
  font-size:14.5px;
  font-weight:500;
  color:var(--ink-soft);
  position:relative;
  top:1px;
}
.tab-btn .n{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--ink-soft);
  margin-left:5px;
}
.tab-btn.active{
  color:var(--ink);
  border-bottom:2px solid var(--accent);
  font-weight:600;
}

.panel{display:none;}
.panel.active{display:block; animation: fadein .22s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}

/* ---- Lý thuyết ---- */
.ly-thuyet{
  max-width:760px;
  font-size:16px;
  line-height:1.75;
}
.ly-thuyet p{margin:0 0 16px;}
.lt-panel{
  display:none;
  max-width:760px;
}
.lt-panel.active{display:block; animation: fadein .22s ease;}
.block{
  margin: 0;
}
.block-label{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--accent);
  margin-bottom:8px;
  font-weight:500;
}
.block.dinhnghia, .block.dinhly{
  border:1px solid var(--line-strong);
  border-left:4px solid var(--accent);
  border-radius:0 var(--radius-m) var(--radius-m) 0;
  padding:18px 22px;
  background:var(--surface);
  box-shadow: var(--shadow);
}
.block.dinhnghia .block-label{color:var(--ink-soft);}
.block.dinhly .block-title, .block.dinhnghia .block-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:20px;
  line-height:1.3;
  margin-bottom:10px;
  color:var(--accent-ink);
}
.block.luuy{
  border-left:4px solid var(--amber);
  background:var(--amber-soft);
  padding:16px 20px;
  border-radius:0 var(--radius-m) var(--radius-m) 0;
  font-size:15px;
}
.block.luuy .block-label{color:var(--amber);}
.block.luuy .block-title{
  font-family:var(--serif);
  font-weight:700;
  font-size:18px;
  margin-bottom:8px;
  color:var(--ink);
}
.block.text .block-title,
.block.text > p:first-child strong,
.block.text > p:first-child b{
  font-family:var(--serif);
  font-weight:700;
  font-size:20px;
  color:var(--accent-ink);
  display:block;
  margin-bottom:12px;
  line-height:1.3;
}
.block > :last-child{margin-bottom:0;}


/* ---- Ví dụ ---- */
.sub-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:16px;
}
.sub-tab{
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink-soft);
  border-radius:99px;
  padding:6px 14px;
  font-family:var(--sans);
  font-size:13px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.sub-tab:hover{background:var(--accent-soft); color:var(--ink);}
.sub-tab.active{
  background:var(--accent);
  border-color:var(--accent);
  color:#fff;
}

.vidu{
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  overflow:hidden;
  background:var(--surface);
  display:none;
}
.vidu.active{display:block; animation: fadein .22s ease;}
.vidu-head{
  padding:14px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  border-bottom:1px solid var(--line);
}
.vidu-head .ten{
  font-family:var(--serif);
  font-weight:600;
  font-size:16px;
}
.vidu-body{padding:18px 20px; font-size:15.5px; line-height:1.7;}
.vidu-de{margin-bottom:2px;}
.reveal-btn{
  border:1px solid var(--line-strong);
  background:transparent;
  color:var(--accent-ink);
  border-radius:99px;
  padding:6px 14px;
  font-family:var(--sans);
  font-size:12.5px;
  font-weight:500;
  cursor:pointer;
  white-space:nowrap;
}
.reveal-btn:hover{background:var(--accent-soft);}
.loigiai{
  margin-top:16px;
  padding-top:16px;
  border-top:1px dashed var(--line-strong);
  display:none;
}
.loigiai.show{display:block;}
.loigiai .tag{
  font-family:var(--mono);
  font-size:10.5px;
  color:var(--amber);
  margin-bottom:10px;
}
.loigiai-layout{
  display:flex;
  gap:20px;
  align-items:flex-start;
}
.loigiai-text{
  flex:1;
  min-width:0;
  font-size:15.5px;
  line-height:1.7;
}
.loigiai-text > p:first-child{margin-top:0;}
.loigiai-fig{
  flex:0 0 280px;
  width:280px;
  position:sticky;
  top:16px;
}
@media (max-width:720px){
  .loigiai-layout{flex-direction:column;}
  .loigiai-fig{flex:none; width:100%; position:static;}
}

.img-placeholder{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0;
  padding:16px;
  border:2px dashed var(--line-strong);
  border-radius:var(--radius-m);
  background:var(--paper);
  color:var(--ink-soft);
  text-align:center;
  min-height:180px;
  position:relative;
  transition: border-color .2s, background .2s;
  width:100%;
  box-sizing:border-box;
}
.img-placeholder:hover,
.img-placeholder.dragover{
  border-color:var(--accent);
  background:var(--accent-soft);
}
.img-placeholder.has-image{
  border-style:solid;
  padding:10px;
  min-height:0;
}
.img-placeholder .ph-empty{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
  pointer-events:none;
}
.img-placeholder.has-image .ph-empty{display:none;}
.img-placeholder .ph-icon{font-size:28px; line-height:1;}
.img-placeholder .ph-title{font-size:14px; font-weight:500; color:var(--ink);}
.img-placeholder .ph-hint{font-size:11.5px; opacity:.75;}
.img-placeholder .ph-preview{
  display:none;
  width:100%;
}
.img-placeholder.has-image .ph-preview{display:block;}
.img-placeholder .ph-preview img{
  max-width:100%;
  height:auto;
  border-radius:var(--radius-s);
  display:block;
  margin:0 auto;
}
.img-placeholder .ph-actions{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-top:4px;
}
.img-placeholder .ph-btn{
  border:1px solid var(--line-strong);
  background:var(--surface);
  color:var(--ink);
  border-radius:99px;
  padding:6px 12px;
  font-family:var(--sans);
  font-size:12px;
  font-weight:500;
  cursor:pointer;
}
.img-placeholder .ph-btn:hover{background:var(--accent-soft); border-color:var(--accent);}
.img-placeholder .ph-btn.danger{color:var(--danger); border-color:var(--danger);}
.img-placeholder .ph-btn.danger:hover{background:rgba(168,67,46,.08);}
.img-placeholder input[type="file"]{display:none;}
.loigiai img, .vidu-body img{
  max-width:100%;
  height:auto;
  border-radius:var(--radius-s);
  margin:12px 0;
  display:block;
}




/* ---- Bài tập ---- */
.baitap{
  display:none;
  gap:14px;
  padding:18px 20px;
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  background:var(--surface);
  box-shadow: var(--shadow);
  max-width:760px;
}
.baitap.active{display:flex; animation: fadein .22s ease;}
.baitap .idx{
  font-family:var(--serif);
  font-style:italic;
  font-size:20px;
  color:var(--accent);
  flex:none;
  width:28px;
  line-height:1.4;
}
.baitap-content{flex:1; min-width:0;}
.baitap-de{font-size:15.5px; line-height:1.7;}
.baitap-de > p:last-child{margin-bottom:0;}
.baitap-meta{
  display:flex;
  gap:8px;
  margin-top:10px;
  align-items:center;
}
.baitap-answer{
  margin-top:12px;
  padding:12px 16px;
  background:var(--accent-soft);
  border-radius:var(--radius-s);
  font-size:14.5px;
  display:none;
}
.baitap-answer.show{display:block;}



.empty-state{
  padding:60px 20px;
  text-align:center;
  color:var(--ink-soft);
  max-width:420px;
  margin:0 auto;
}
.empty-state .big{
  font-family:var(--serif);
  font-style:italic;
  font-size:22px;
  color:var(--ink);
  margin-bottom:8px;
}

/* ---- Điểm danh ---- */
.dd-sessions{margin-bottom:20px;}
.dd-stats{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  margin-bottom:22px;
  max-width:760px;
}
.dd-stat{
  border:1px solid var(--line);
  border-radius:var(--radius-m);
  background:var(--surface);
  padding:14px 16px;
  box-shadow: var(--shadow);
}
.dd-stat-num{
  font-family:var(--serif);
  font-weight:700;
  font-size:26px;
  line-height:1.1;
  color:var(--ink);
}
.dd-stat.present .dd-stat-num{color:var(--accent-ink);}
.dd-stat.absent .dd-stat-num{color:var(--danger);}
.dd-stat-label{
  margin-top:4px;
  font-size:12px;
  color:var(--ink-soft);
}
.dd-toolbar{
  display:flex;
  flex-wrap:wrap;

        },

          tieuDe: "Định lý 3",

        },
        {
          loai: "luuy",
          noiDung: String.raw`**Hệ quả 1:** Cho hai đường tròn không đồng tâm $(O_1),(O_2)$. Các điểm $A,B$ thuộc $(O_1)$, $C,D$ thuộc $(O_2)$. Khi đó các phát biểu sau là tương đương:

        {
          ten: "Ví dụ 1 (Định lí Euler)",
          de: String.raw`Cho $R,r$ lần lượt là bán kính đường tròn ngoại tiếp và nội tiếp của một tam giác. Khi đó, khoảng cách $d$ giữa hai tâm của hai đường tròn này là $\sqrt{R(R-2r)}$.`,
          loiGiai: String.raw`Xét tam giác $ABC$ có tâm đường tròn nội tiếp và ngoại tiếp lần lượt là $I,O$.
Tia $BI$ cắt đường tròn tại $M$, $MK$ là đường kính. $ID$ vuông góc với $BC$ tại $D$.

<div class="img-placeholder" data-img-slot="euler-1"></div>

Để tính khoảng cách giữa $I$ và $O$, ta tính phương tích của $I$ so với $(O)$.

Trước tiên, ta lưu ý rằng tam giác $MIC$ có
$$\angle MIC=\angle MCI=\dfrac{\angle B+\angle C}{2}$$
nên tam giác này cân tại $M$ và suy ra $MI=MC$.

Do $\triangle IDB \sim \triangle MCK$ đồng dạng nên suy ra
$$BI\cdot MC=MK \cdot ID.$$

Rõ ràng $$BI\cdot MC=BI\cdot IM=-\overline{IB}\cdot\overline{IM}=-\mathscr{P}_{I/(O)}=R^2-OI^2$$
và $MK\cdot ID=2R\cdot r$ nên ta suy ra
$$OI^2=R^2-2Rr.$$

Vậy $d=OI=\sqrt{R(R-2r)}$. $\square$`
        },
        {
          ten: "Ví dụ 2 (USAMO 1990)",
          de: String.raw`Cho tam giác $ABC$ nhọn. Đường thẳng qua $B$, vuông góc với $AC$ cắt đường tròn đường kính $AC$ tại $P,Q$. Đường thẳng qua $C$, vuông góc với $AB$ cắt đường tròn đường kính $AB$ tại $R,S$. Chứng minh $P,Q,R,S$ cùng thuộc một đường tròn.`,

Từ đó rõ ràng $4$ điểm $P,Q,R,S$ cùng thuộc một đường tròn. $\square$`
        },
        {
          ten: "Ví dụ 3",

Gọi $D$ là trung điểm của $BC$. Khi đó ta có $D \in (AOE)$. Gọi $T$ là giao điểm của $AF$ và $OD$. Ta sẽ chứng minh $T$ là điểm cố định.

nên $T$ cố định. $\square$`
        },
        {
          ten: "Ví dụ 4 (CPS Match 2024)",
          de: String.raw`Cho tứ giác $ABCD$ sao cho $AB=BC=CD$. Các điểm $X,Y$ lần lượt nằm trên các tia $CA,BD$ sao cho $BX=CY$. Gọi $P,Q,R,S$ lần lượt là trung điểm của các đoạn thẳng $BX,CY,XD,YA$. Chứng minh rằng các điểm $P,Q,R,S$ cùng thuộc một đường tròn.`,
          loiGiai: String.raw`<div class="img-placeholder" data-img-slot="cps-2024"></div>

Gọi $M$ là trung điểm của $XY$. Nhận thấy $PR$ là đường trung bình trong các tam giác $XBD$ và $XBY$, do đó $M$ nằm trên $PR$. Tương tự, $M$ cũng nằm trên $QS$.

Gọi $\omega_1$ là đường tròn tâm $B$ bán kính $AB=BC$ và $\omega_2$ là đường tròn tâm $C$ bán kính $BC=CD$.

        },
        {
          ten: "Ví dụ 5 (Olympiad Iran 2025)",
          de: String.raw`Cho tam giác $ABC$ nhọn, có ba cạnh đôi một khác nhau. Đường phân giác trong của góc $A$ cắt cạnh đối diện $BC$ tại $E$ và cắt cung nhỏ $BC$ của đường tròn ngoại tiếp tam giác $ABC$ tại $M$. Giả sử $D\neq M$ là một điểm trên cung nhỏ $BC$ sao cho $ED=EM$. Ngoài ra, gọi $P$ là một điểm trên đoạn thẳng $AD$ sao cho $\angle ABP=\angle ACP\neq 0$. Gọi $O$ là tâm đường tròn ngoại tiếp tam giác $ABC$. Chứng minh rằng $OP\perp AM$.`,
          loiGiai: String.raw`<div class="img-placeholder" data-img-slot="iran-2025"></div>

Từ $O$, kẻ đường vuông góc với $AM$ cắt $AD$ và $BC$ lần lượt tại $P'$ và $X$. Vì $O$ và $E$ đều nằm trên đường trung trực của $MD$ nên $OE\perp MD$. Vì $E$ là trực tâm của $\triangle OXM$ (điều này suy ra $XE\perp OM$, $ME\perp OX$ và $OE\perp XM$), và ta có $OE\perp MD$, nên $XM$ và $MD$ là cùng một đường thẳng. Do đó $X$, $M$, $D$ thẳng hàng. Vậy ta có:

$$\Rightarrow \angle P'BA = \angle OBA - \angle OBP' = (90^\circ - C) - \dfrac{B-C}{2} = (90^\circ - B) + \dfrac{B-C}{2} = \angle P'CA.$$

/* ---------- Markdown nhẹ: đoạn văn theo dòng trống ---------- */
function paragraphize(str){
  return str
    .trim()
    .split(/\n\s*\n/)
    .map(p => {
      const t = p.trim();
      // Cho phép block HTML thô (placeholder hình, v.v.) không bọc trong <p>
      if (/^<(div|figure|img|table|ul|ol|blockquote)\b/i.test(t)) return t;
      const withBold = t.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\n/g,"<br>");
      return `<p>${withBold}</p>`;
    })
    .join("");
}

  if(block.loai === "luuy") return "Lưu ý";
  // text: lấy dòng đầu, bỏ markdown **
  const first = (block.noiDung || "").trim().split(/\n/)[0]
    .replace(/^\*\*|\*\*$/g, "").replace(/^\*\s*/, "").trim();
  if(first.length > 36) return first.slice(0, 34) + "…";
  return first || ("Mục " + (index + 1));
}

function renderLyThuyetBlock(block){
  if(block.loai === "text"){
    return `<div class="block text">${paragraphize(block.noiDung)}</div>`;
  }
  const label = block.loai === "dinhnghia" ? "Định nghĩa" : block.loai === "dinhly" ? "Định lý" : "Lưu ý";
  const titleHtml = block.tieuDe ? `<div class="block-title">${block.tieuDe}</div>` : "";
  return `
    <div class="block ${block.loai}">
      <div class="block-label">${label}</div>
      ${titleHtml}
      ${paragraphize(block.noiDung)}
    </div>`;
}


function doKhoBadge(doKho){
  const map = { de: ["dễ","de"], vua: ["vừa","vua"], kho: ["khó","kho"] };
  const [label, cls] = map[doKho] || map.vua;
  return `<span class="badge ${cls}">${label}</span>`;
}

/* ---------- Render tab Điểm danh ---------- */
function renderDiemDanh(){
  document.getElementById("mb-title").textContent = "Điểm danh";
  const content = document.getElementById("content");
  const sessions = DATA.diemDanh;

  if(!sessions.length){
    content.innerHTML = `
      <div class="crumbs">Điểm danh</div>
      <div class="topic-head"><h1 class="topic-title">Điểm danh</h1></div>
      ${emptyPanel("Chưa có dữ liệu điểm danh nào.")}`;
    return;
  }

  const session = currentDiemDanhSession();
  state.currentDiemDanhSession = session.id;

  const search = (state.diemDanhSearch || "").trim().toLowerCase();
  const lopFilter = state.diemDanhLop || "";
  const statusFilter = state.diemDanhStatus || "all";

  const allRows = session.danhSach.map(hs => ({hs, present: isPresent(session, hs)}));
  const rows = allRows.filter(r => {
    if(lopFilter && r.hs.lop !== lopFilter) return false;
    if(statusFilter === "present" && !r.present) return false;
    if(statusFilter === "absent" && r.present) return false;
    if(search){
      const hoten = (r.hs.ho + " " + r.hs.ten).toLowerCase();
      if(!hoten.includes(search) && !r.hs.lop.toLowerCase().includes(search)) return false;
    }
    return true;
  });

  const total = allRows.length;
  const presentCount = allRows.filter(r => r.present).length;
  const absentCount = total - presentCount;
  const pct = total ? Math.round((presentCount / total) * 100) : 0;

  const lopList = [...new Set(session.danhSach.map(hs => hs.lop))].sort((a,b) => a.localeCompare(b, "vi"));

  content.innerHTML = `
    <div class="crumbs">Điểm danh <span>/ ${session.ngay}</span></div>
    <div class="topic-head">
      <h1 class="topic-title">Điểm danh — ${session.ngay}</h1>
    </div>

    ${sessions.length > 1 ? `
    <div class="sub-tabs dd-sessions">
      ${sessions.map(s => `<button type="button" class="sub-tab ${s.id===session.id?"active":""}" data-session="${s.id}">${s.ngay}</button>`).join("")}
    </div>` : ""}

    <div class="dd-stats">
      <div class="dd-stat"><div class="dd-stat-num">${total}</div><div class="dd-stat-label">Tổng số</div></div>
      <div class="dd-stat present"><div class="dd-stat-num">${presentCount}</div><div class="dd-stat-label">Có mặt</div></div>
      <div class="dd-stat absent"><div class="dd-stat-num">${absentCount}</div><div class="dd-stat-label">Vắng</div></div>
      <div class="dd-stat"><div class="dd-stat-num">${pct}%</div><div class="dd-stat-label">Tỷ lệ có mặt</div></div>
    </div>

    <div class="dd-toolbar">
      <div class="search-box dd-search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="dd-search-input" type="text" placeholder="Tìm theo tên hoặc lớp…">
      </div>
      <select id="dd-lop-filter" class="dd-select">
        <option value="">Tất cả lớp</option>
        ${lopList.map(l => `<option value="${l}" ${l===lopFilter?"selected":""}>${l}</option>`).join("")}
      </select>
      <div class="dd-status-chips">
        <button type="button" class="dd-chip ${statusFilter==="all"?"active":""}" data-status="all">Tất cả</button>
        <button type="button" class="dd-chip ${statusFilter==="present"?"active":""}" data-status="present">Có mặt</button>
        <button type="button" class="dd-chip ${statusFilter==="absent"?"active":""}" data-status="absent">Vắng</button>
      </div>
    </div>

    <div class="dd-table-wrap">
      <table class="dd-table">
        <thead>
          <tr>
            <th class="stt">STT</th>
            <th>Họ và tên</th>
            <th>Lớp</th>
            <th class="status">Trạng thái</th>
          </tr>
        </thead>
        <tbody>
          ${rows.length ? rows.map(r => `
            <tr class="${r.present ? "" : "row-absent"}">
              <td class="stt">${r.hs.stt}</td>
              <td>${r.hs.ho} ${r.hs.ten}</td>
              <td>${r.hs.lop}</td>
              <td class="status">
                <button type="button" class="dd-status-btn ${r.present ? "present" : "absent"}" data-stt="${r.hs.stt}">
                  ${r.present ? "Có mặt" : "Vắng"}
                </button>
              </td>
            </tr>
          `).join("") : `<tr><td colspan="4" class="dd-empty">Không tìm thấy học sinh phù hợp.</td></tr>`}
        </tbody>
      </table>
    </div>
  `;

  const searchInput = document.getElementById("dd-search-input");
  searchInput.value = state.diemDanhSearch || "";
  searchInput.addEventListener("input", () => {
    state.diemDanhSearch = searchInput.value;
    const caret = searchInput.selectionStart;
    renderDiemDanh();
    const el = document.getElementById("dd-search-input");
    if(el){ el.focus(); try{ el.setSelectionRange(caret, caret); }catch(e){} }
  });

  document.getElementById("dd-lop-filter").addEventListener("change", (e) => {
    state.diemDanhLop = e.target.value;
    renderDiemDanh();
  });

  if(sessions.length > 1){
    content.querySelectorAll("[data-session]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.currentDiemDanhSession = btn.dataset.session;
        state.diemDanhSearch = "";
        state.diemDanhLop = "";
        state.diemDanhStatus = "all";
        renderDiemDanh();
      });
    });
  }

  content.querySelectorAll(".dd-chip").forEach(btn => {
    btn.addEventListener("click", () => {

      renderDiemDanh();

  content.querySelectorAll(".dd-status-btn").forEach(btn => {

  updateAttendanceBadge();

/* ---------- Image upload (localStorage base64) ---------- */
function loadImage(slotId){
  try{ return localStorage.getItem(IMAGE_KEY_PREFIX + slotId) || null; }
  catch(e){ return null; }
}
function saveImage(slotId, dataUrl){
  try{ localStorage.setItem(IMAGE_KEY_PREFIX + slotId, dataUrl); }
  catch(e){ alert("Không lưu được ảnh (có thể quá lớn hoặc localStorage đầy)."); }
}
function removeImage(slotId){
  try{ localStorage.removeItem(IMAGE_KEY_PREFIX + slotId); }
  catch(e){}
}

function enhanceImagePlaceholders(container){
  // Tách khung hình sang cột phải của lời giải
  container.querySelectorAll(".loigiai").forEach(loigiai => {
    if(loigiai.querySelector(".loigiai-layout")) return;
    const placeholders = [...loigiai.querySelectorAll(".img-placeholder")];
    if(!placeholders.length) return;

    const tag = loigiai.querySelector(".tag");
    const layout = document.createElement("div");
    layout.className = "loigiai-layout";
    const textCol = document.createElement("div");
    textCol.className = "loigiai-text";
    const figCol = document.createElement("div");
    figCol.className = "loigiai-fig";

    // Di chuyển mọi node (trừ tag) vào text, placeholder vào fig
    [...loigiai.childNodes].forEach(node => {
      if(node === tag) return;
      if(node.nodeType === 1 && node.classList && node.classList.contains("img-placeholder")){
        figCol.appendChild(node);
      } else if(node.nodeType === 1 && node.querySelector && node.querySelector(".img-placeholder")){
        // đoạn <p> bọc placeholder (nếu có) — lấy placeholder ra
        const ph = node.querySelector(".img-placeholder");
        if(ph) figCol.appendChild(ph);
        const leftover = node.textContent.trim();
        if(leftover) textCol.appendChild(node);
      } else {
        textCol.appendChild(node);
      }
    });

    placeholders.forEach(ph => {
      if(ph.parentNode !== figCol) figCol.appendChild(ph);
    });

    layout.appendChild(textCol);
    layout.appendChild(figCol);
    loigiai.appendChild(layout);
  });

  container.querySelectorAll(".img-placeholder").forEach((el, idx) => {
    const slotId = el.dataset.imgSlot || (`auto-${state.currentBai || "x"}-${idx}`);
    el.dataset.imgSlot = slotId;

    const existing = loadImage(slotId);
    el.innerHTML = `
      <div class="ph-empty">
        <div class="ph-icon">📷</div>
        <div class="ph-title">Chèn hình minh họa</div>
        <div class="ph-hint">Bấm hoặc kéo thả ảnh</div>
      </div>
      <div class="ph-preview"><img alt="Hình minh họa"></div>
      <div class="ph-actions">
        <button type="button" class="ph-btn ph-upload">Chọn ảnh</button>
        <button type="button" class="ph-btn danger ph-remove" style="display:none">Xóa ảnh</button>
      </div>
      <input type="file" accept="image/*">
    `;

    const fileInput = el.querySelector('input[type="file"]');
    const previewImg = el.querySelector(".ph-preview img");
    const btnUpload = el.querySelector(".ph-upload");
    const btnRemove = el.querySelector(".ph-remove");

    function showImage(dataUrl){
      if(dataUrl){
        previewImg.src = dataUrl;
        el.classList.add("has-image");
        btnRemove.style.display = "";
        btnUpload.textContent = "Đổi ảnh";
      } else {
        previewImg.removeAttribute("src");
        el.classList.remove("has-image");
        btnRemove.style.display = "none";
        btnUpload.textContent = "Chọn ảnh";
      }
    }

    showImage(existing);

    btnUpload.addEventListener("click", () => fileInput.click());
    btnRemove.addEventListener("click", () => {
      removeImage(slotId);
      showImage(null);
    });

    fileInput.addEventListener("change", () => {
      const file = fileInput.files && fileInput.files[0];
      if(!file) return;
      if(!file.type.startsWith("image/")){ alert("Vui lòng chọn file ảnh."); return; }
      if(file.size > 2.5 * 1024 * 1024){ alert("Ảnh quá lớn (tối đa ~2.5MB)."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        saveImage(slotId, reader.result);
        showImage(reader.result);
      };
      reader.readAsDataURL(file);
      fileInput.value = "";
    });

    el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("dragover"); });
    el.addEventListener("dragleave", () => el.classList.remove("dragover"));
    el.addEventListener("drop", e => {
      e.preventDefault();
      el.classList.remove("dragover");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      if(!file || !file.type.startsWith("image/")) return;
      if(file.size > 2.5 * 1024 * 1024){ alert("Ảnh quá lớn (tối đa ~2.5MB)."); return; }
      const reader = new FileReader();
      reader.onload = () => {
        saveImage(slotId, reader.result);
        showImage(reader.result);
      };
      reader.readAsDataURL(file);
    });
  });
}



/* ---------- Sidebar ---------- */
function renderSidebar(){
  const toc = document.getElementById("toc");
  const search = document.getElementById("search").value.trim().toLowerCase();

  toc.innerHTML = DATA.chuongs.map(c=>{
    const bais = c.bais.filter(b => !search || b.ten.toLowerCase().includes(search) || c.ten.toLowerCase().includes(search));
    if(search && bais.length===0) return "";
    const doneCount = c.bais.filter(b=>isDone(b.id)).length;
    const isOpen = search ? true : (state.currentChuong === c.id || DATA.chuongs.indexOf(c)===0 && !state.currentChuong);
    return `
      <div class="chuong ${isOpen ? "open":""}" data-chuong="${c.id}">
        <button class="chuong-head" type="button">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 6 6 6-6 6"/></svg>
          <span class="ctitle">${c.ten}</span>
          <span class="ccount">${doneCount}/${c.bais.length}</span>
        </button>
        <ul class="bai-list">
          ${bais.map(b=>`
            <li>
              <button class="bai-link ${isDone(b.id)?"done":""} ${state.currentBai===b.id?"active":""}" data-bai="${b.id}" data-chuong="${c.id}" type="button">
                <span class="dot"></span>
                <span>${b.ten}</span>
              </button>
            </li>
          `).join("")}
        </ul>
      </div>`;
  }).join("");

  toc.querySelectorAll(".chuong-head").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      btn.closest(".chuong").classList.toggle("open");
    });
  });
  toc.querySelectorAll(".bai-link").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      state.view = "hoc";
      setViewSwitchActive();
      state.currentChuong = btn.dataset.chuong;
      state.currentBai = btn.dataset.bai;
      state.currentTab = "ly-thuyet";

      state.currentVidu = 0;
      state.currentBaitap = 0;
      renderSidebar();
      renderContent();
      closeMobileNav();



    });
  });
}

  });
}

/* ---------- Mobile nav ---------- */
function openMobileNav(){ document.body.classList.add("nav-open"); }
function closeMobileNav(){ document.body.classList.remove("nav-open"); }

/* ---------- Theme toggle ---------- */
function applyTheme(t){
  if(t === "light" || t === "dark"){
    document.documentElement.setAttribute("data-theme", t);
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_KEY); }catch(e){}
  applyTheme(saved);
}

/* ---------- Init ---------- */
function init(){
  document.getElementById("ten-mon").textContent = DATA.monHoc;
  document.getElementById("mo-ta").textContent = DATA.moTa;
  initTheme();

  document.getElementById("hamburger").addEventListener("click", openMobileNav);
  document.getElementById("scrim").addEventListener("click", closeMobileNav);
  document.getElementById("search").addEventListener("input", renderSidebar);
  document.getElementById("theme-btn").addEventListener("click", ()=>{
    const current = document.documentElement.getAttribute("data-theme");
    const next = current === "dark" ? "light" : current === "light" ? null : "dark";
    applyTheme(next);
    try{
      if(next) localStorage.setItem(THEME_KEY, next);
      else localStorage.removeItem(THEME_KEY);
    }catch(e){}
  });

  initViewSwitch();
  renderSidebar();
  updateOverallProgress();
  updateAttendanceBadge();
  renderContent();
}
init();
</script>
</body>
</html>
